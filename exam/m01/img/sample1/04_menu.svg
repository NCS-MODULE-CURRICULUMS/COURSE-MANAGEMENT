<rect x="0" y="346" width="960" height="34" fill="#1f3a63"/><text x="24" y="367" font-size="12.5" fill="#dbe4f0">계층만 그리지 말고 그 깊이로 정한 이유를 함께 적는다 — 채점 항목 18번의 「직관적」이 이것이다.</text>

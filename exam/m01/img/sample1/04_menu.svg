<text x="316" y="276" font-size="12.5" fill="#2b4c7e" font-weight="700">깊이를 2단으로 묶은 이유</text>
<text x="316" y="296" font-size="12" fill="#6b7280">상품 → 상세 → 장바구니가 한 흐름이라</text>

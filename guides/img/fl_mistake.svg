<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 348" width="900" height="348"><style>text{font-family:"Malgun Gothic",sans-serif}rect,line,path{stroke-width:1}</style><defs><marker id="on" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="og" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#bbb"/></marker></defs><rect width="900" height="348" fill="#fff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#000" text-anchor="start">자주 나오는 잘못 — 왼쪽이 잘못된 것, 오른쪽이 고친 것</text><line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/><line x1="450" y1="50" x2="450" y2="328" stroke="#ccc"/><text x="36" y="72" font-size="12" font-weight="700" fill="#000" text-anchor="start">① 화살표를 빈 채로 두었습니다</text><rect x="36" y="90" width="150" height="46" rx="0" fill="#fff" stroke="#000"/><text x="111.0" y="117.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">상품 상세</text><rect x="256" y="90" width="150" height="46" rx="0" fill="#fff" stroke="#000"/><text x="331.0" y="117.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">장바구니</text><line x1="186" y1="113" x2="256" y2="113" stroke="#000" marker-end="url(#on)"/><text x="20" y="160" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">무엇을 눌러 넘어가는지 알 수 없습니다</text><text x="480" y="72" font-size="12" font-weight="700" fill="#000" text-anchor="start">이동 조건을 적었습니다</text><rect x="480" y="90" width="150" height="46" rx="0" fill="#fff" stroke="#000"/><text x="555.0" y="117.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">상품 상세</text><rect x="700" y="90" width="150" height="46" rx="0" fill="#fff" stroke="#000"/><text x="775.0" y="117.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">장바구니</text><line x1="630" y1="113" x2="700" y2="113" stroke="#000" marker-end="url(#on)"/><text x="665" y="104" font-size="10.5" font-weight="400" fill="#000" text-anchor="middle">담기</text><text x="480" y="160" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">이동 조건이 곧 폼 흐름입니다 (17번)</text><line x1="20" y1="186" x2="880" y2="186" stroke="#ccc"/><text x="36" y="212" font-size="12" font-weight="700" fill="#000" text-anchor="start">② 제약을 글상자로만 적었습니다</text><rect x="36" y="230" width="370" height="58" rx="0" fill="#fff" stroke="#000"/><text x="52" y="254" font-size="11" font-weight="700" fill="#000" text-anchor="start">제약사항</text><text x="52" y="274" font-size="11.5" font-weight="400" fill="#333" text-anchor="start">장바구니부터는 로그인이 필요합니다</text><text x="20" y="312" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">글로만 남기면 흐름에 반영한 것이 아닙니다</text><text x="480" y="212" font-size="12" font-weight="700" fill="#000" text-anchor="start">점선 흐름으로 그렸습니다</text><rect x="480" y="230" width="150" height="46" rx="0" fill="#fff" stroke="#000"/><text x="555.0" y="257.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">장바구니</text><rect x="700" y="230" width="150" height="46" rx="0" fill="#fff" stroke="#000"/><text x="775.0" y="257.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">로그인</text><line x1="630" y1="244" x2="700" y2="244" stroke="#000" stroke-dasharray="5 4" marker-end="url(#on)"/><text x="665" y="236" font-size="10.5" font-weight="400" fill="#000" text-anchor="middle">비로그인</text><line x1="700" y1="264" x2="630" y2="264" stroke="#000" stroke-dasharray="5 4" marker-end="url(#on)"/><text x="665" y="292" font-size="10.5" font-weight="400" fill="#000" text-anchor="middle">성공하면 복귀</text><text x="480" y="312" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">수행준거 4가 말하는 「반영」이 이것입니다</text></svg>
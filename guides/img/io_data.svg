<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 306" width="900" height="306"><style>text{font-family:"Malgun Gothic",sans-serif}rect,line,path{stroke-width:1}</style><defs><marker id="on" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="og" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#888"/></marker></defs><rect width="900" height="306" fill="#fff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#000" text-anchor="start">데이터 · 정보 · 데이터베이스 — 무엇이 다른가</text><line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/><text x="36" y="70" font-size="12" font-weight="700" fill="#000" text-anchor="start">① 데이터 — 값 하나하나</text><rect x="36" y="86" width="96" height="34" fill="#fff" stroke="#000"/><text x="84.0" y="107.5" font-size="11.5" font-weight="400" fill="#000" text-anchor="middle">홍길동</text><rect x="140" y="86" width="96" height="34" fill="#fff" stroke="#000"/><text x="188.0" y="107.5" font-size="11.5" font-weight="400" fill="#000" text-anchor="middle">010-1111-2222</text><rect x="244" y="86" width="96" height="34" fill="#fff" stroke="#000"/><text x="292.0" y="107.5" font-size="11.5" font-weight="400" fill="#000" text-anchor="middle">자바 기초</text><rect x="348" y="86" width="96" height="34" fill="#fff" stroke="#000"/><text x="396.0" y="107.5" font-size="11.5" font-weight="400" fill="#000" text-anchor="middle">180000</text><text x="36" y="146" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">그 자체로는 무슨 뜻인지 알 수 없습니다</text><line x1="452" y1="103" x2="496" y2="103" stroke="#000" marker-end="url(#on)"/><text x="516" y="70" font-size="12" font-weight="700" fill="#000" text-anchor="start">② 정보 — 뜻이 붙은 것</text><rect x="516" y="86" width="350" height="34" fill="#fff" stroke="#000"/><text x="528" y="108" font-size="11.5" font-weight="400" fill="#000" text-anchor="start">홍길동이 «자바 기초» 를 180,000원에 신청했다</text><text x="516" y="146" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">누가 · 무엇을 · 얼마에 — 이제 뜻이 생겼습니다</text><line x1="20" y1="170" x2="880" y2="170" stroke="#ccc"/><text x="36" y="198" font-size="12" font-weight="700" fill="#000" text-anchor="start">③ 데이터베이스 — 그런 것을 «여럿이 함께 쓰려고» 모아 둔 곳</text><rect x="36" y="216" width="134" height="48" fill="#fff" stroke="#000"/><text x="103.0" y="237.0" font-size="12.5" font-weight="700" fill="#000" text-anchor="middle">회원</text><text x="103.0" y="255.0" font-size="11" font-weight="400" fill="#555" text-anchor="middle">누가</text><rect x="186" y="216" width="134" height="48" fill="#fff" stroke="#000"/><text x="253.0" y="237.0" font-size="12.5" font-weight="700" fill="#000" text-anchor="middle">강좌</text><text x="253.0" y="255.0" font-size="11" font-weight="400" fill="#555" text-anchor="middle">무엇을</text><rect x="336" y="216" width="134" height="48" fill="#fff" stroke="#000"/><text x="403.0" y="237.0" font-size="12.5" font-weight="700" fill="#000" text-anchor="middle">강사</text><text x="403.0" y="255.0" font-size="11" font-weight="400" fill="#555" text-anchor="middle">누가 가르치나</text><rect x="486" y="216" width="134" height="48" fill="#fff" stroke="#000"/><text x="553.0" y="237.0" font-size="12.5" font-weight="700" fill="#000" text-anchor="middle">신청</text><text x="553.0" y="255.0" font-size="11" font-weight="400" fill="#555" text-anchor="middle">언제 신청했나</text><rect x="650" y="216" width="216" height="48" fill="#f2f2f2" stroke="#000"/><text x="758.0" y="244.5" font-size="12.5" font-weight="700" fill="#000" text-anchor="middle">= 데이터베이스</text><text x="36" y="292" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">한 곳에 모아 두면 «같은 것을 두 번 적지 않아도» 됩니다</text></svg>
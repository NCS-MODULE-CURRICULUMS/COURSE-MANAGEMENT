<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384"><style>text{font-family:"Malgun Gothic",sans-serif}rect,line,path{stroke-width:1}</style><defs><marker id="on" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="og" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#888"/></marker></defs><rect width="900" height="384" fill="#fff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#000" text-anchor="start">데이터베이스와 DBMS — 같은 말이 아닙니다</text><line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/><rect x="300" y="62" width="300" height="46" fill="#fff" stroke="#000"/><text x="450.0" y="82.0" font-size="13" font-weight="700" fill="#000" text-anchor="middle">사람 · 프로그램</text><text x="450.0" y="100.0" font-size="11" font-weight="400" fill="#555" text-anchor="middle">무엇을 해 달라고 «부탁» 합니다</text><line x1="450" y1="108" x2="450" y2="148" stroke="#000" marker-end="url(#on)"/><text x="462" y="132.0" font-size="10.5" font-weight="400" fill="#000" text-anchor="start">SQL 로 말합니다</text><rect x="240" y="148" width="420" height="86" fill="#f2f2f2" stroke="#000"/><text x="450" y="174" font-size="13" font-weight="700" fill="#000" text-anchor="middle">DBMS  (데이터베이스 관리 시스템)</text><text x="450" y="196" font-size="11" font-weight="400" fill="#555" text-anchor="middle">MySQL · Oracle · PostgreSQL · SQL Server</text><text x="450" y="218" font-size="11" font-weight="400" fill="#555" text-anchor="middle">말을 알아듣고 · 순서를 지키고 · 권한을 보고 · 빠르게 찾아 줍니다</text><line x1="450" y1="234" x2="450" y2="274" stroke="#000" marker-end="url(#on)"/><text x="462" y="258.0" font-size="10.5" font-weight="400" fill="#000" text-anchor="start">읽고 씁니다</text><rect x="300" y="274" width="300" height="46" fill="#fff" stroke="#000"/><text x="450.0" y="294.0" font-size="13" font-weight="700" fill="#000" text-anchor="middle">데이터베이스</text><text x="450.0" y="312.0" font-size="11" font-weight="400" fill="#555" text-anchor="middle">저장장치에 실제로 «앉아 있는 값»</text><line x1="20" y1="338" x2="880" y2="338" stroke="#ccc"/><text x="36" y="360" font-size="12" font-weight="700" fill="#000" text-anchor="start">데이터베이스 = 모아 둔 «값»  ·  DBMS = 그 값을 다뤄 주는 «프로그램»</text><text x="36" y="378" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">흔히 둘 다 «DB» 라고 부릅니다. 이 교안에서는 갈라서 씁니다.</text></svg>
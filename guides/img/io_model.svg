<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300"><style>text{font-family:"Malgun Gothic",sans-serif}rect,line,path{stroke-width:1}</style><defs><marker id="on" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="og" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#888"/></marker></defs><rect width="900" height="300" fill="#fff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#000" text-anchor="start">설계는 세 번에 나누어 합니다</text><line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/><rect x="36" y="62" width="262" height="40" fill="#f2f2f2" stroke="#000"/><text x="167.0" y="86.5" font-size="13" font-weight="700" fill="#000" text-anchor="middle">개념 모델링</text><text x="36" y="122" font-size="11.5" font-weight="700" fill="#000" text-anchor="start">무슨 덩어리가 있나</text><rect x="36" y="132" width="262" height="28" fill="#fff" stroke="#000"/><text x="167.0" y="150.5" font-size="11" font-weight="400" fill="#000" text-anchor="middle">회원</text><rect x="36" y="164" width="262" height="28" fill="#fff" stroke="#000"/><text x="167.0" y="182.5" font-size="11" font-weight="400" fill="#000" text-anchor="middle">강좌</text><rect x="36" y="196" width="262" height="28" fill="#fff" stroke="#000"/><text x="167.0" y="214.5" font-size="11" font-weight="400" fill="#000" text-anchor="middle">신청</text><text x="36" y="248" font-size="11" font-weight="400" fill="#555" text-anchor="start">속성 · 자료형은 아직</text><line x1="302" y1="82" x2="328" y2="82" stroke="#000" marker-end="url(#on)"/><rect x="326" y="62" width="262" height="40" fill="#f2f2f2" stroke="#000"/><text x="457.0" y="86.5" font-size="13" font-weight="700" fill="#000" text-anchor="middle">논리 모델링</text><text x="326" y="122" font-size="11.5" font-weight="700" fill="#000" text-anchor="start">속성과 관계를 정한다</text><rect x="326" y="132" width="262" height="28" fill="#fff" stroke="#000"/><text x="457.0" y="150.5" font-size="11" font-weight="400" fill="#000" text-anchor="middle">회원(아이디·이름·연락처)</text><rect x="326" y="164" width="262" height="28" fill="#fff" stroke="#000"/><text x="457.0" y="182.5" font-size="11" font-weight="400" fill="#000" text-anchor="middle">강좌(코드·이름·수강료)</text><rect x="326" y="196" width="262" height="28" fill="#fff" stroke="#000"/><text x="457.0" y="214.5" font-size="11" font-weight="400" fill="#000" text-anchor="middle">신청 = 회원 × 강좌</text><text x="326" y="248" font-size="11" font-weight="400" fill="#555" text-anchor="start">어느 DBMS 인지는 아직</text><line x1="592" y1="82" x2="618" y2="82" stroke="#000" marker-end="url(#on)"/><rect x="616" y="62" width="262" height="40" fill="#f2f2f2" stroke="#000"/><text x="747.0" y="86.5" font-size="13" font-weight="700" fill="#000" text-anchor="middle">물리 모델링</text><text x="616" y="122" font-size="11.5" font-weight="700" fill="#000" text-anchor="start">실제 표로 만든다</text><rect x="616" y="132" width="262" height="28" fill="#fff" stroke="#000"/><text x="747.0" y="150.5" font-size="11" font-weight="400" fill="#000" text-anchor="middle">member VARCHAR(20)</text><rect x="616" y="164" width="262" height="28" fill="#fff" stroke="#000"/><text x="747.0" y="182.5" font-size="11" font-weight="400" fill="#000" text-anchor="middle">course VARCHAR(10)</text><rect x="616" y="196" width="262" height="28" fill="#fff" stroke="#000"/><text x="747.0" y="214.5" font-size="11" font-weight="400" fill="#000" text-anchor="middle">apply INT AUTO_INCREMENT</text><text x="616" y="248" font-size="11" font-weight="400" fill="#555" text-anchor="start">MySQL 에 맞춰 확정</text><line x1="20" y1="266" x2="880" y2="266" stroke="#ccc"/><text x="36" y="288" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">이 교과의 능력단위요소 ① 이 «논리», ② 가 «물리» 입니다. 개념은 앞 교과에서 끝난 것으로 봅니다</text></svg>
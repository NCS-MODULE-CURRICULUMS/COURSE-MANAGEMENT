<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 322" width="900" height="322"><style>text{font-family:"Malgun Gothic",sans-serif}rect,line,path{stroke-width:1}</style><defs><marker id="on" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="og" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#888"/></marker></defs><rect width="900" height="322" fill="#fff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#000" text-anchor="start">SQL — DBMS 에게 말을 거는 말</text><line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/><rect x="36" y="62" width="828" height="62" fill="#f2f2f2" stroke="#000"/><text x="56" y="88" font-size="14" font-weight="700" fill="#000" text-anchor="start" font-family="Consolas,monospace">SELECT member_nm, phone</text><text x="56" y="112" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">&#8593; 무엇을 볼지</text><text x="330" y="88" font-size="14" font-weight="700" fill="#000" text-anchor="start" font-family="Consolas,monospace">FROM member</text><text x="330" y="112" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">&#8593; 어디서</text><text x="480" y="88" font-size="14" font-weight="700" fill="#000" text-anchor="start" font-family="Consolas,monospace">WHERE member_id = 'hong';</text><text x="480" y="112" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">&#8593; 어떤 것만</text><text x="36" y="158" font-size="12" font-weight="700" fill="#000" text-anchor="start">네 마디만 알면 됩니다</text><rect x="36" y="172" width="110" height="26" fill="#f2f2f2" stroke="#000"/><text x="91.0" y="189.5" font-size="12" font-weight="700" fill="#000" text-anchor="middle">SELECT</text><text x="164" y="190" font-size="12" font-weight="700" fill="#000" text-anchor="start">고른다</text><text x="264" y="190" font-size="11.5" font-weight="400" fill="#555" text-anchor="start" font-family="Consolas,monospace">SELECT member_nm FROM member</text><rect x="36" y="202" width="110" height="26" fill="#f2f2f2" stroke="#000"/><text x="91.0" y="219.5" font-size="12" font-weight="700" fill="#000" text-anchor="middle">INSERT</text><text x="164" y="220" font-size="12" font-weight="700" fill="#000" text-anchor="start">새로 넣는다</text><text x="264" y="220" font-size="11.5" font-weight="400" fill="#555" text-anchor="start" font-family="Consolas,monospace">INSERT INTO member VALUES (...)</text><rect x="36" y="232" width="110" height="26" fill="#f2f2f2" stroke="#000"/><text x="91.0" y="249.5" font-size="12" font-weight="700" fill="#000" text-anchor="middle">UPDATE</text><text x="164" y="250" font-size="12" font-weight="700" fill="#000" text-anchor="start">고친다</text><text x="264" y="250" font-size="11.5" font-weight="400" fill="#555" text-anchor="start" font-family="Consolas,monospace">UPDATE member SET phone = ... WHERE ...</text><rect x="36" y="262" width="110" height="26" fill="#f2f2f2" stroke="#000"/><text x="91.0" y="279.5" font-size="12" font-weight="700" fill="#000" text-anchor="middle">DELETE</text><text x="164" y="280" font-size="12" font-weight="700" fill="#000" text-anchor="start">지운다</text><text x="264" y="280" font-size="11.5" font-weight="400" fill="#555" text-anchor="start" font-family="Consolas,monospace">DELETE FROM member WHERE ...</text><line x1="20" y1="300" x2="880" y2="300" stroke="#ccc"/><text x="36" y="318" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">WHERE 를 빼면 «표 전체» 에 걸립니다 — UPDATE · DELETE 에서 특히 조심합니다</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400"><style>text{font-family:"Malgun Gothic",sans-serif}rect,line,path{stroke-width:1}</style><defs><marker id="on" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="og" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#888"/></marker></defs><rect width="900" height="400" fill="#fff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#000" text-anchor="start">엑셀 파일로 하면 무엇이 곤란한가 — 왼쪽이 파일, 오른쪽이 데이터베이스</text><line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/><line x1="450" y1="50" x2="450" y2="380" stroke="#ccc"/><text x="36" y="74" font-size="12" font-weight="700" fill="#000" text-anchor="start">① 두 사람이 동시에 고치면</text><rect x="36" y="86" width="370" height="28" fill="#fff" stroke="#000"/><text x="221.0" y="104.5" font-size="11.5" font-weight="400" fill="#000" text-anchor="middle">김 선생이 열어 고치는 중</text><rect x="36" y="118" width="370" height="28" fill="#fff" stroke="#000"/><text x="221.0" y="136.5" font-size="11.5" font-weight="400" fill="#000" text-anchor="middle">박 선생도 같은 파일을 염</text><text x="36" y="170" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">나중에 저장한 쪽이 «덮어씁니다»</text><rect x="480" y="86" width="370" height="28" fill="#fff" stroke="#000"/><text x="665.0" y="104.5" font-size="11.5" font-weight="400" fill="#000" text-anchor="middle">김 선생의 수정</text><rect x="480" y="118" width="370" height="28" fill="#fff" stroke="#000"/><text x="665.0" y="136.5" font-size="11.5" font-weight="400" fill="#000" text-anchor="middle">박 선생의 수정</text><text x="480" y="170" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">둘 다 순서대로 반영됩니다</text><line x1="20" y1="188" x2="880" y2="188" stroke="#eee"/><text x="36" y="202" font-size="12" font-weight="700" fill="#000" text-anchor="start">② 중간에 전원이 꺼지면</text><rect x="36" y="214" width="370" height="28" fill="#fff" stroke="#000"/><text x="221.0" y="232.5" font-size="11.5" font-weight="400" fill="#000" text-anchor="middle">절반만 저장된 파일</text><text x="36" y="266" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">어디까지 저장됐는지 «알 수 없습니다»</text><rect x="480" y="214" width="370" height="28" fill="#fff" stroke="#000"/><text x="665.0" y="232.5" font-size="11.5" font-weight="400" fill="#000" text-anchor="middle">확정 전이면 통째로 취소</text><text x="480" y="266" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">한 묶음이 «다» 되거나 «다» 안 됩니다</text><line x1="20" y1="284" x2="880" y2="284" stroke="#eee"/><text x="36" y="298" font-size="12" font-weight="700" fill="#000" text-anchor="start">③ 50만 줄에서 한 줄을 찾으면</text><rect x="36" y="310" width="370" height="28" fill="#fff" stroke="#000"/><text x="221.0" y="328.5" font-size="11.5" font-weight="400" fill="#000" text-anchor="middle">처음부터 끝까지 훑음</text><text x="36" y="362" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">줄이 늘수록 «비례해» 느려집니다</text><rect x="480" y="310" width="370" height="28" fill="#fff" stroke="#000"/><text x="665.0" y="328.5" font-size="11.5" font-weight="400" fill="#000" text-anchor="middle">찾아보기(색인)로 바로</text><text x="480" y="362" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">50만 줄이어도 거의 그대로입니다</text></svg>
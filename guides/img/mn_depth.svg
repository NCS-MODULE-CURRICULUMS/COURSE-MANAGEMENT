<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900" height="392"><style>text{font-family:"Malgun Gothic",sans-serif}rect,line,path{stroke-width:1}</style><defs><marker id="on" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="og" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#bbb"/></marker></defs><rect width="900" height="392" fill="#fff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#000" text-anchor="start">깊이를 왜 2단으로 두는가 — 누르는 횟수가 곧 이탈입니다</text><line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/><text x="40" y="68" font-size="12" font-weight="700" fill="#000" text-anchor="start">2단 · 상품까지 두 번</text><text x="500" y="68" font-size="12" font-weight="700" fill="#000" text-anchor="start">4단 · 상품까지 네 번</text><rect x="40" y="88" width="200" height="32" rx="0" fill="#fff" stroke="#000"/><text x="140.0" y="108.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">홈</text><line x1="140" y1="120" x2="140" y2="136" stroke="#000" marker-end="url(#on)"/><rect x="40" y="138" width="200" height="32" rx="0" fill="#fff" stroke="#000"/><text x="140.0" y="158.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">전체 카테고리</text><line x1="140" y1="170" x2="140" y2="186" stroke="#000" marker-end="url(#on)"/><rect x="40" y="188" width="200" height="32" rx="0" fill="#fff" stroke="#000"/><text x="140.0" y="208.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">식품 상품 목록</text><rect x="500" y="88" width="200" height="32" rx="0" fill="#fff" stroke="#000"/><text x="600.0" y="108.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">홈</text><line x1="600" y1="120" x2="600" y2="136" stroke="#000" marker-end="url(#on)"/><rect x="500" y="138" width="200" height="32" rx="0" fill="#fff" stroke="#000"/><text x="600.0" y="158.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">전체 카테고리</text><line x1="600" y1="170" x2="600" y2="186" stroke="#000" marker-end="url(#on)"/><rect x="500" y="188" width="200" height="32" rx="0" fill="#fff" stroke="#000"/><text x="600.0" y="208.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">신선식품</text><line x1="600" y1="220" x2="600" y2="236" stroke="#000" marker-end="url(#on)"/><rect x="500" y="238" width="200" height="32" rx="0" fill="#fff" stroke="#000"/><text x="600.0" y="258.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">과일</text><line x1="600" y1="270" x2="600" y2="286" stroke="#000" marker-end="url(#on)"/><rect x="500" y="288" width="200" height="32" rx="0" fill="#fff" stroke="#000"/><text x="600.0" y="308.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">사과 목록</text><line x1="450" y1="56" x2="450" y2="336" stroke="#ccc"/><text x="20" y="352" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">한 단계가 늘면 목록을 한 번 더 읽고 한 번 더 눌러야 합니다. 읽는 시간까지 더해지므로 체감 차이는 클릭 수보다 큽니다.</text><text x="20" y="372" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">깊이를 줄이면 1단이 늘어납니다. 어느 쪽을 택했는지만 적어 두면 됩니다.</text></svg>
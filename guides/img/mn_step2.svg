<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380"><style>text{font-family:"Malgun Gothic",sans-serif}rect,line,path{stroke-width:1}</style><defs><marker id="on" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="og" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#bbb"/></marker></defs><rect width="900" height="380" fill="#fff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#000" text-anchor="start">2단계. 2단으로 묶고 그 깊이로 정한 이유를 적습니다</text><line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/><rect x="380" y="30" width="140" height="46" rx="0" fill="#fff" stroke="#bbb"/><text x="450.0" y="57.5" font-size="12.5" font-weight="400" fill="#bbb" text-anchor="middle">데일리마켓</text><line x1="450" y1="76" x2="450" y2="96" stroke="#bbb"/><line x1="165" y1="96" x2="735" y2="96" stroke="#bbb"/><line x1="165" y1="96" x2="165" y2="120" stroke="#bbb"/><line x1="355" y1="96" x2="355" y2="120" stroke="#bbb"/><line x1="545" y1="96" x2="545" y2="120" stroke="#bbb"/><line x1="735" y1="96" x2="735" y2="120" stroke="#bbb"/><rect x="90" y="120" width="150" height="46" rx="0" fill="#fff" stroke="#bbb"/><text x="165.0" y="147.5" font-size="12.5" font-weight="400" fill="#bbb" text-anchor="middle">전체 카테고리</text><rect x="280" y="120" width="150" height="46" rx="0" fill="#fff" stroke="#bbb"/><text x="355.0" y="147.5" font-size="12.5" font-weight="400" fill="#bbb" text-anchor="middle">신상품</text><rect x="470" y="120" width="150" height="46" rx="0" fill="#fff" stroke="#bbb"/><text x="545.0" y="147.5" font-size="12.5" font-weight="400" fill="#bbb" text-anchor="middle">베스트</text><rect x="660" y="120" width="150" height="46" rx="0" fill="#fff" stroke="#bbb"/><text x="735.0" y="147.5" font-size="12.5" font-weight="400" fill="#bbb" text-anchor="middle">마이페이지</text><line x1="106" y1="166" x2="106" y2="295" stroke="#000"/><line x1="106" y1="215" x2="120" y2="215" stroke="#000"/><rect x="120" y="200" width="120" height="30" rx="0" fill="#fff" stroke="#000"/><text x="180.0" y="219.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">식품</text><line x1="106" y1="255" x2="120" y2="255" stroke="#000"/><rect x="120" y="240" width="120" height="30" rx="0" fill="#fff" stroke="#000"/><text x="180.0" y="259.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">생활용품</text><line x1="106" y1="295" x2="120" y2="295" stroke="#000"/><rect x="120" y="280" width="120" height="30" rx="0" fill="#fff" stroke="#000"/><text x="180.0" y="299.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">가전</text><line x1="676" y1="166" x2="676" y2="295" stroke="#000"/><line x1="676" y1="215" x2="690" y2="215" stroke="#000"/><rect x="690" y="200" width="120" height="30" rx="0" fill="#fff" stroke="#000"/><text x="750.0" y="219.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">장바구니</text><line x1="676" y1="255" x2="690" y2="255" stroke="#000"/><rect x="690" y="240" width="120" height="30" rx="0" fill="#fff" stroke="#000"/><text x="750.0" y="259.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">주문 내역</text><line x1="676" y1="295" x2="690" y2="295" stroke="#000"/><rect x="690" y="280" width="120" height="30" rx="0" fill="#fff" stroke="#000"/><text x="750.0" y="299.5" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">회원 정보</text><rect x="300" y="206" width="300" height="68" rx="0" fill="#fff" stroke="#000"/><text x="316" y="228" font-size="11.5" font-weight="700" fill="#000" text-anchor="start">깊이를 2단으로 정한 이유</text><text x="316" y="248" font-size="11" font-weight="400" fill="#333" text-anchor="start">상품 → 상세 → 장바구니가 한 흐름이라</text><text x="316" y="264" font-size="11" font-weight="400" fill="#333" text-anchor="start">3단으로 내려가면 구매까지의 이탈이 커집니다</text><text x="20" y="336" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">한 메뉴의 2단은 셋에서 다섯 개가 적당합니다. 그보다 많아지면 묶는 기준을 다시 잡습니다.</text><text x="20" y="356" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">2단 이름은 화면 목록의 화면명과 같게 둡니다. 다르게 적으면 어느 화면인지 찾기 어렵습니다.</text></svg>
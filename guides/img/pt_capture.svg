<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330"><style>text{font-family:"Malgun Gothic",sans-serif}rect,line,path,circle,ellipse{stroke-width:1}</style><defs><marker id="on" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="og" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#bbb"/></marker></defs><rect width="900" height="330" fill="#fff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#000" text-anchor="start">5단계. 캡처 세 장이 각각 다른 것을 증명합니다</text><line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/><text x="36" y="62" font-size="12" font-weight="700" fill="#000" text-anchor="start">① Figma 캔버스</text><text x="36" y="78" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">프레임과 연결선이 보이게</text><rect x="36" y="84" width="260" height="150" rx="0" fill="#fff" stroke="#000"/><text x="296" y="78" font-size="10.5" font-weight="700" fill="#000" text-anchor="end">채점 17</text><text x="320" y="62" font-size="12" font-weight="700" fill="#000" text-anchor="start">② 대표 화면 확대</text><text x="320" y="78" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">스타일가이드 값과 대조</text><rect x="320" y="84" width="260" height="150" rx="0" fill="#fff" stroke="#000"/><text x="580" y="78" font-size="10.5" font-weight="700" fill="#000" text-anchor="end">채점 12 · 13 · 16</text><text x="604" y="62" font-size="12" font-weight="700" fill="#000" text-anchor="start">③ Prototype 패널</text><text x="604" y="78" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">효과가 줄마다 보이게</text><rect x="604" y="84" width="260" height="150" rx="0" fill="#fff" stroke="#000"/><text x="864" y="78" font-size="10.5" font-weight="700" fill="#000" text-anchor="end">채점 14 · 15</text><rect x="50" y="106" width="64" height="78" rx="0" fill="#fff" stroke="#999"/><rect x="55" y="111" width="54" height="8" rx="2" fill="#eef1f5"/><rect x="55" y="124" width="54" height="22" rx="2" fill="#f4f5f7"/><circle cx="114" cy="144" r="3" fill="#fff" stroke="#000"/><line x1="118" y1="144" x2="128" y2="144" stroke="#000" marker-end="url(#on)"/><rect x="128" y="106" width="64" height="78" rx="0" fill="#fff" stroke="#999"/><rect x="133" y="111" width="54" height="8" rx="2" fill="#eef1f5"/><rect x="133" y="124" width="54" height="22" rx="2" fill="#f4f5f7"/><circle cx="192" cy="144" r="3" fill="#fff" stroke="#000"/><line x1="196" y1="144" x2="206" y2="144" stroke="#000" marker-end="url(#on)"/><rect x="206" y="106" width="64" height="78" rx="0" fill="#fff" stroke="#999"/><rect x="211" y="111" width="54" height="8" rx="2" fill="#eef1f5"/><rect x="211" y="124" width="54" height="22" rx="2" fill="#f4f5f7"/><text x="50" y="206" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">연결선이 남습니다</text><rect x="334" y="102" width="130" height="116" rx="0" fill="#fff" stroke="#999"/><rect x="340" y="108" width="118" height="14" rx="2" fill="#eef1f5"/><rect x="340" y="128" width="118" height="40" rx="2" fill="#f4f5f7"/><rect x="340" y="174" width="70" height="10" rx="2" fill="#f4f5f7"/><rect x="340" y="190" width="60" height="20" rx="3" fill="#fff" stroke="#999"/><text x="476" y="124" font-size="10.5" font-weight="400" fill="#000" text-anchor="start">헤더 #2b4c7e</text><line x1="468" y1="120" x2="472" y2="120" stroke="#999"/><text x="476" y="146" font-size="10.5" font-weight="400" fill="#000" text-anchor="start">가격 #e8590c</text><line x1="468" y1="142" x2="472" y2="142" stroke="#999"/><text x="476" y="168" font-size="10.5" font-weight="400" fill="#000" text-anchor="start">버튼 높이 40</text><line x1="468" y1="164" x2="472" y2="164" stroke="#999"/><text x="618" y="120" font-size="10.5" font-weight="700" fill="#000" text-anchor="start">GNB 메뉴</text><text x="690" y="120" font-size="10" font-weight="400" fill="#555" text-anchor="start">On hover → Open overlay</text><line x1="618" y1="130" x2="850" y2="130" stroke="#e6e8eb"/><text x="618" y="148" font-size="10.5" font-weight="700" fill="#000" text-anchor="start">상품 카드</text><text x="690" y="148" font-size="10" font-weight="400" fill="#555" text-anchor="start">On hover → Change to</text><line x1="618" y1="158" x2="850" y2="158" stroke="#e6e8eb"/><text x="618" y="176" font-size="10.5" font-weight="700" fill="#000" text-anchor="start">담기</text><text x="690" y="176" font-size="10" font-weight="400" fill="#555" text-anchor="start">On click → Open overlay</text><line x1="618" y1="186" x2="850" y2="186" stroke="#e6e8eb"/><text x="618" y="204" font-size="10.5" font-weight="700" fill="#000" text-anchor="start">주문하기</text><text x="690" y="204" font-size="10" font-weight="400" fill="#555" text-anchor="start">On click → Navigate to</text><line x1="618" y1="214" x2="850" y2="214" stroke="#e6e8eb"/><text x="20" y="268" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">세 장 가운데 하나라도 빠지면 그 항목은 확인할 근거가 없어집니다.</text><text x="20" y="288" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">캡처는 링크와 별도로 파일 안에 넣습니다. 권한이 바뀌면 링크는 열리지 않습니다.</text></svg>
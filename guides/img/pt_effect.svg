<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 348" width="900" height="348"><style>text{font-family:"Malgun Gothic",sans-serif}rect,line,path,circle,ellipse{stroke-width:1}</style><defs><marker id="on" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="og" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#bbb"/></marker></defs><rect width="900" height="348" fill="#fff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#000" text-anchor="start">4단계. 효과는 두 종류를 서로 다른 줄로 만듭니다</text><line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/><line x1="452" y1="50" x2="452" y2="322" stroke="#ccc"/><text x="36" y="68" font-size="12" font-weight="700" fill="#000" text-anchor="start">채점 14 · GNB 메뉴 효과</text><rect x="36" y="82" width="386" height="34" rx="0" fill="#fff" stroke="#000"/><text x="52" y="104" font-size="11" font-weight="700" fill="#000" text-anchor="start">전체 카테고리</text><line x1="52" y1="110" x2="126" y2="110" stroke="#000"/><text x="148" y="104" font-size="11" font-weight="400" fill="#555" text-anchor="start">신상품</text><text x="244" y="104" font-size="11" font-weight="400" fill="#555" text-anchor="start">베스트</text><text x="340" y="104" font-size="11" font-weight="400" fill="#555" text-anchor="start">마이페이지</text><rect x="40" y="124" width="150" height="84" rx="0" fill="#fff" stroke="#000" stroke-dasharray="4 3"/><text x="54" y="148" font-size="11" font-weight="400" fill="#000" text-anchor="start">식품</text><text x="54" y="170" font-size="11" font-weight="400" fill="#000" text-anchor="start">생활용품</text><text x="54" y="192" font-size="11" font-weight="400" fill="#000" text-anchor="start">가전</text><line x1="120" y1="116" x2="120" y2="124" stroke="#000" marker-end="url(#on)"/><text x="200" y="150" font-size="11" font-weight="700" fill="#000" text-anchor="start">On hover</text><text x="200" y="168" font-size="11" font-weight="400" fill="#000" text-anchor="start">→ Open overlay</text><text x="200" y="186" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">   Move in 150ms</text><text x="20" y="236" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">현재 있는 메뉴는 굵게 두고 밑줄을 둡니다.</text><text x="20" y="256" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">어디에 있는지 알려 주는 것도 메뉴 효과에 들어갑니다.</text><text x="480" y="68" font-size="12" font-weight="700" fill="#000" text-anchor="start">채점 15 · 그 밖의 효과</text><rect x="480" y="82" width="150" height="100" rx="0" fill="#fff" stroke="#000"/><rect x="488" y="90" width="134" height="52" rx="2" fill="#f4f5f7"/><rect x="488" y="148" width="90" height="10" rx="2" fill="#f4f5f7"/><rect x="488" y="164" width="60" height="10" rx="2" fill="#f4f5f7"/><text x="555" y="200" font-size="10.5" font-weight="400" fill="#555" text-anchor="middle">기본</text><rect x="676" y="88" width="150" height="100" rx="2" fill="#e9ebee"/><rect x="670" y="82" width="150" height="100" rx="0" fill="#fff" stroke="#000"/><rect x="678" y="90" width="134" height="52" rx="2" fill="#f4f5f7"/><rect x="678" y="148" width="90" height="10" rx="2" fill="#f4f5f7"/><rect x="678" y="164" width="60" height="10" rx="2" fill="#f4f5f7"/><text x="745" y="200" font-size="10.5" font-weight="400" fill="#555" text-anchor="middle">hover — 그림자</text><line x1="634" y1="132" x2="666" y2="132" stroke="#000" marker-end="url(#on)"/><rect x="480" y="226" width="240" height="32" rx="4" fill="#fff" stroke="#000"/><text x="500" y="246" font-size="11" font-weight="400" fill="#000" text-anchor="start">장바구니에 담았습니다</text><text x="736" y="246" font-size="10.5" font-weight="700" fill="#000" text-anchor="start">Open overlay</text><text x="736" y="262" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">Move in 200ms</text><text x="20" y="298" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">두 효과를 한 줄에 몰아 적으면 하나로 봅니다. 14번과 15번을 각각 다른 줄로 적습니다.</text><text x="20" y="318" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">hover 는 스타일가이드에서 그려 둔 버튼 상태를 그대로 씁니다. 여기서 새로 만들지 않습니다.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 302" width="900" height="302"><style>text{font-family:"Malgun Gothic",sans-serif}rect,line,path,circle,ellipse{stroke-width:1}</style><defs><marker id="on" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="og" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#bbb"/></marker></defs><rect width="900" height="302" fill="#fff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#000" text-anchor="start">1단계. 프레임을 만들고 화면코드로 이름을 붙입니다</text><line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/><text x="36" y="84" font-size="10" font-weight="700" fill="#555" text-anchor="start">SC-01 메인</text><rect x="36" y="92" width="148" height="110" rx="0" fill="#fff" stroke="#000"/><rect x="44" y="100" width="132" height="12" rx="2" fill="#eef1f5"/><rect x="44" y="118" width="132" height="34" rx="2" fill="#f4f5f7"/><rect x="44.0" y="158" width="28.0" height="26" rx="2" fill="#f4f5f7"/><rect x="77.0" y="158" width="28.0" height="26" rx="2" fill="#f4f5f7"/><rect x="110.0" y="158" width="28.0" height="26" rx="2" fill="#f4f5f7"/><rect x="143.0" y="158" width="28.0" height="26" rx="2" fill="#f4f5f7"/><text x="206" y="84" font-size="10" font-weight="700" fill="#555" text-anchor="start">SC-02 상품 목록</text><rect x="206" y="92" width="148" height="110" rx="0" fill="#fff" stroke="#000"/><rect x="214" y="100" width="132" height="12" rx="2" fill="#eef1f5"/><rect x="214.0" y="118" width="39.0" height="28" rx="2" fill="#f4f5f7"/><rect x="258.0" y="118" width="39.0" height="28" rx="2" fill="#f4f5f7"/><rect x="302.0" y="118" width="39.0" height="28" rx="2" fill="#f4f5f7"/><rect x="214.0" y="152" width="39.0" height="28" rx="2" fill="#f4f5f7"/><rect x="258.0" y="152" width="39.0" height="28" rx="2" fill="#f4f5f7"/><rect x="302.0" y="152" width="39.0" height="28" rx="2" fill="#f4f5f7"/><text x="376" y="84" font-size="10" font-weight="700" fill="#555" text-anchor="start">SC-03 상품 상세</text><rect x="376" y="92" width="148" height="110" rx="0" fill="#fff" stroke="#000"/><rect x="384" y="100" width="132" height="12" rx="2" fill="#eef1f5"/><rect x="384" y="118" width="62.0" height="46" rx="2" fill="#f4f5f7"/><rect x="452.0" y="118" width="62.0" height="12" rx="2" fill="#f4f5f7"/><rect x="452.0" y="136" width="44.0" height="12" rx="2" fill="#f4f5f7"/><rect x="452.0" y="154" width="62.0" height="14" rx="2" fill="#f4f5f7"/><text x="546" y="84" font-size="10" font-weight="700" fill="#555" text-anchor="start">SC-04 장바구니</text><rect x="546" y="92" width="148" height="110" rx="0" fill="#fff" stroke="#000"/><rect x="554" y="100" width="132" height="12" rx="2" fill="#eef1f5"/><rect x="554" y="118" width="132" height="14" rx="2" fill="#f4f5f7"/><rect x="554" y="138" width="132" height="14" rx="2" fill="#f4f5f7"/><rect x="554" y="158" width="132" height="14" rx="2" fill="#f4f5f7"/><text x="716" y="84" font-size="10" font-weight="700" fill="#555" text-anchor="start">SC-05 주문 · 결제</text><rect x="716" y="92" width="148" height="110" rx="0" fill="#fff" stroke="#000"/><rect x="724" y="100" width="132" height="12" rx="2" fill="#eef1f5"/><rect x="724" y="118" width="132" height="16" rx="2" fill="#f4f5f7"/><rect x="724" y="140" width="132" height="16" rx="2" fill="#f4f5f7"/><rect x="724" y="162" width="66.0" height="16" rx="2" fill="#f4f5f7"/><text x="20" y="238" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">프레임 이름을 화면코드로 붙이면 화면 목록 · 흐름도 · 채점표가 같은 이름을 씁니다.</text><text x="20" y="258" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">Frame 1 처럼 기본값으로 두면 강사가 어느 화면인지 대조할 수 없습니다.</text><text x="20" y="278" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">세 화면 이상이면 되지만 흐름이 끊기지 않도록 다섯 장을 이어 만드는 편이 낫습니다.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900" height="356"><style>text{font-family:"Malgun Gothic",sans-serif}rect,line,path,circle,ellipse{stroke-width:1}</style><defs><marker id="on" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="og" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#bbb"/></marker></defs><rect width="900" height="356" fill="#fff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#000" text-anchor="start">자주 나오는 잘못 — 왼쪽이 잘못된 것, 오른쪽이 고친 것</text><line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/><line x1="452" y1="50" x2="452" y2="336" stroke="#ccc"/><text x="36" y="72" font-size="12" font-weight="700" fill="#000" text-anchor="start">① 정지된 그림을 늘어놓았습니다</text><text x="36" y="88" font-size="10" font-weight="700" fill="#555" text-anchor="start">Frame 1</text><rect x="36" y="94" width="148" height="86" rx="0" fill="#fff" stroke="#000"/><rect x="44" y="102" width="132" height="10" rx="2" fill="#eef1f5"/><rect x="44" y="118" width="132" height="30" rx="2" fill="#f4f5f7"/><text x="238" y="88" font-size="10" font-weight="700" fill="#555" text-anchor="start">Frame 2</text><rect x="238" y="94" width="148" height="86" rx="0" fill="#fff" stroke="#000"/><rect x="246" y="102" width="132" height="10" rx="2" fill="#eef1f5"/><rect x="246" y="118" width="132" height="30" rx="2" fill="#f4f5f7"/><text x="20" y="206" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">이름으로는 어느 화면인지 알 수 없고 연결선이 없어 17번을 볼 수 없습니다</text><text x="480" y="72" font-size="12" font-weight="700" fill="#000" text-anchor="start">이름을 붙이고 연결했습니다</text><text x="480" y="88" font-size="10" font-weight="700" fill="#555" text-anchor="start">SC-02 상품 목록</text><rect x="480" y="94" width="148" height="86" rx="0" fill="#fff" stroke="#000"/><rect x="488" y="102" width="132" height="10" rx="2" fill="#eef1f5"/><rect x="488" y="118" width="132" height="30" rx="2" fill="#f4f5f7"/><text x="682" y="88" font-size="10" font-weight="700" fill="#555" text-anchor="start">SC-03 상품 상세</text><rect x="682" y="94" width="148" height="86" rx="0" fill="#fff" stroke="#000"/><rect x="690" y="102" width="132" height="10" rx="2" fill="#eef1f5"/><rect x="690" y="118" width="132" height="30" rx="2" fill="#f4f5f7"/><circle cx="628" cy="145" r="4" fill="#fff" stroke="#000"/><line x1="632" y1="145" x2="682" y2="145" stroke="#000" marker-end="url(#on)"/><text x="655" y="136" font-size="10" font-weight="400" fill="#000" text-anchor="middle">상품 선택</text><line x1="20" y1="232" x2="880" y2="232" stroke="#ccc"/><text x="36" y="258" font-size="12" font-weight="700" fill="#000" text-anchor="start">② 효과를 한 줄에 몰아 적었습니다</text><rect x="36" y="272" width="386" height="44" rx="0" fill="#fff" stroke="#000"/><text x="50" y="292" font-size="10.5" font-weight="700" fill="#000" text-anchor="start">구현한 효과</text><text x="50" y="308" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">GNB 드롭다운과 카드 hover, 토스트를 넣었습니다</text><text x="20" y="340" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">한 줄이면 효과 하나로 봅니다. 14번만 인정되고 15번은 비어 있습니다</text><text x="480" y="258" font-size="12" font-weight="700" fill="#000" text-anchor="start">줄을 나눠 적었습니다</text><rect x="480" y="272" width="386" height="62" rx="0" fill="#fff" stroke="#000"/><line x1="480" y1="303" x2="866" y2="303" stroke="#ccc"/><text x="494" y="288" font-size="10.5" font-weight="700" fill="#000" text-anchor="start">GNB 메뉴 효과</text><text x="600" y="288" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">On hover → Open overlay (Move in 150ms)</text><text x="494" y="320" font-size="10.5" font-weight="700" fill="#000" text-anchor="start">그 밖의 효과</text><text x="600" y="320" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">상품 카드 On hover → Change to (그림자)</text></svg>
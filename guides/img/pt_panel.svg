<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 312" width="900" height="312"><style>text{font-family:"Malgun Gothic",sans-serif}rect,line,path,circle,ellipse{stroke-width:1}</style><defs><marker id="on" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="og" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#bbb"/></marker></defs><rect width="900" height="312" fill="#fff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#000" text-anchor="start">연결 하나를 이루는 네 가지 — Prototype 패널이 묻는 것</text><line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/><rect x="36" y="62" width="300" height="202" rx="0" fill="#fff" stroke="#000"/><rect x="37" y="63" width="298" height="24" rx="2" fill="#eef1f5"/><text x="48" y="79" font-size="11" font-weight="700" fill="#000" text-anchor="start">Prototype</text><text x="48" y="119" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">Trigger</text><rect x="146" y="104" width="178" height="24" rx="3" fill="#fff" stroke="#999"/><text x="156" y="120" font-size="11" font-weight="400" fill="#000" text-anchor="start">On click</text><line x1="336" y1="116" x2="400" y2="116" stroke="#ccc"/><text x="48" y="157" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">Action</text><rect x="146" y="142" width="178" height="24" rx="3" fill="#fff" stroke="#999"/><text x="156" y="158" font-size="11" font-weight="400" fill="#000" text-anchor="start">Navigate to</text><line x1="336" y1="154" x2="400" y2="154" stroke="#ccc"/><text x="48" y="195" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">Destination</text><rect x="146" y="180" width="178" height="24" rx="3" fill="#fff" stroke="#999"/><text x="156" y="196" font-size="11" font-weight="400" fill="#000" text-anchor="start">SC-03 상품 상세</text><line x1="336" y1="192" x2="400" y2="192" stroke="#ccc"/><text x="48" y="233" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">Animation</text><rect x="146" y="218" width="178" height="24" rx="3" fill="#fff" stroke="#999"/><text x="156" y="234" font-size="11" font-weight="400" fill="#000" text-anchor="start">Instant</text><line x1="336" y1="230" x2="400" y2="230" stroke="#ccc"/><text x="410" y="112" font-size="11.5" font-weight="700" fill="#000" text-anchor="start">① Trigger</text><text x="524" y="112" font-size="11.5" font-weight="400" fill="#000" text-anchor="start">사용자가 무엇을 했을 때인가</text><text x="410" y="128" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">On click · On hover · On drag</text><text x="410" y="150" font-size="11.5" font-weight="700" fill="#000" text-anchor="start">② Action</text><text x="524" y="150" font-size="11.5" font-weight="400" fill="#000" text-anchor="start">무엇을 할 것인가</text><text x="410" y="166" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">Navigate to · Open overlay · Change to · Back</text><text x="410" y="188" font-size="11.5" font-weight="700" fill="#000" text-anchor="start">③ Destination</text><text x="524" y="188" font-size="11.5" font-weight="400" fill="#000" text-anchor="start">어느 프레임으로 가는가</text><text x="410" y="204" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">프레임 이름을 고릅니다. 화면코드로 이름을 붙여 둔 이유입니다</text><text x="410" y="226" font-size="11.5" font-weight="700" fill="#000" text-anchor="start">④ Animation</text><text x="524" y="226" font-size="11.5" font-weight="400" fill="#000" text-anchor="start">어떻게 바뀌는가</text><text x="410" y="242" font-size="10.5" font-weight="400" fill="#555" text-anchor="start">Instant · Move in · Smart animate · 시간(ms)</text><text x="20" y="288" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">네 칸을 다 채운 것이 연결 하나입니다. 목록에 이 네 칸이 보이게 캡처합니다.</text></svg>
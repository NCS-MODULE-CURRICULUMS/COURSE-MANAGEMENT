<text class="k" x="576" y="227">잘 됐다</text>
<text class="k" x="22" y="266">—</text>
<text class="s" x="70" y="266">회원이 관리자용 승인을 눌렀다</text>
<line x1="466" y1="262" x2="510" y2="262" stroke="#c00" stroke-dasharray="4 3" marker-end="url(#a3)"/>
<rect x="520" y="252" width="46" height="22" fill="#f4f4f4" stroke="#000"/>
<text class="m" x="543" y="268" text-anchor="middle">403</text>

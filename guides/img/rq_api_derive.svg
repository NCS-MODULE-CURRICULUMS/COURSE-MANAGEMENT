<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340"><style>.s{font-family:"Malgun Gothic",sans-serif;font-size:11.5px}.m{font-family:Consolas,"D2Coding",monospace;font-size:11.5px}.b{font-family:"Malgun Gothic",sans-serif;font-size:12.5px;font-weight:700}.k{font-family:"Malgun Gothic",sans-serif;font-size:11px;fill:#666}</style>
<defs><marker id="s2" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="#000"/></marker><marker id="r2" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9" fill="none" stroke="#c00"/></marker></defs>
<rect width="760" height="340" fill="#fff"/>
<rect width="760" height="340" fill="none" stroke="#999"/>
<text class="b" x="18" y="24">시퀀스의 어느 화살표가 API 가 되는가</text>
<rect x="39.0" y="44" width="62" height="24" fill="#fff" stroke="#000"/>
<text class="s" x="70" y="60" text-anchor="middle">회원</text>
<line x1="70" y1="68" x2="70" y2="210" stroke="#999" stroke-dasharray="4 4"/>
<rect x="156.8" y="44" width="106.39999999999999" height="24" fill="#fff" stroke="#000"/>
<text class="s" x="210" y="60" text-anchor="middle">BookController</text>
<line x1="210" y1="68" x2="210" y2="210" stroke="#999" stroke-dasharray="4 4"/>
<rect x="310.1" y="44" width="99.8" height="24" fill="#fff" stroke="#000"/>
<text class="s" x="360" y="60" text-anchor="middle">RentalService</text>
<line x1="360" y1="68" x2="360" y2="210" stroke="#999" stroke-dasharray="4 4"/>
<rect x="463.3" y="44" width="73.4" height="24" fill="#fff" stroke="#000"/>
<text class="s" x="500" y="60" text-anchor="middle">RentalDAO</text>
<line x1="500" y1="68" x2="500" y2="210" stroke="#999" stroke-dasharray="4 4"/>
<rect x="589.0" y="44" width="62" height="24" fill="#fff" stroke="#000"/>
<text class="s" x="620" y="60" text-anchor="middle">MySQL</text>
<line x1="620" y1="68" x2="620" y2="210" stroke="#999" stroke-dasharray="4 4"/>
<line x1="140.0" y1="32" x2="140.0" y2="226" stroke="#c00" stroke-dasharray="7 4"/>
<text class="k" x="134.0" y="240" text-anchor="end" fill="#c00">바깥</text>
<text class="k" x="146.0" y="240" fill="#c00">시스템 안</text>
<line x1="75" y1="96" x2="205" y2="96" stroke="#c00" stroke-width="2" marker-end="url(#s2)"/>
<text class="s" x="140.0" y="90" text-anchor="middle" fill="#c00">1. 대여 신청(bookId)</text>
<text class="k" x="224" y="100" fill="#c00">&#8592; 이것만 API 가 된다</text>
<line x1="215" y1="126" x2="355" y2="126" stroke="#888" marker-end="url(#s2)"/>
<text class="s" x="285.0" y="120" text-anchor="middle" fill="#888">2. requestRental(...)</text>
<line x1="365" y1="156" x2="495" y2="156" stroke="#888" marker-end="url(#s2)"/>
<text class="s" x="430.0" y="150" text-anchor="middle" fill="#888">3. findStatus(bookId)</text>
<line x1="505" y1="186" x2="615" y2="186" stroke="#888" marker-end="url(#s2)"/>
<text class="s" x="560.0" y="180" text-anchor="middle" fill="#888">4. SELECT status ...</text>
<line x1="18" y1="248" x2="742" y2="248" stroke="#000"/>
<text class="b" x="18" y="270">1번 화살표 하나가 API 한 줄이 된다</text>
<text class="m" x="18" y="296">POST  /rentals   {bookId}   &#8594;  201 {rentalId} / 401 / 409</text>
<text class="k" x="18" y="320">메서드는 «무엇을 하는가», 엔드포인트는 «무엇에 대해», 요청은 «무엇을 주고», 응답은 «무엇을 받는가».</text>
</svg>
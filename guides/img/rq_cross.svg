<text class="k" x="496" y="256">기본 흐름의 «순서» 와 메시지 «순서» 가 같은가</text>
<text class="s" x="18" y="314" fill="#c00">→ 종이 두 장을 옆에 붙여 놓고 한 줄씩 손가락으로 짚으며 맞춰 봅니다.</text>

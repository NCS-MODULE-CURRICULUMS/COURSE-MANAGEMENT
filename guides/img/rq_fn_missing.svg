<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" width="560" height="352">
<style>.m{font-family:Consolas,"D2Coding",monospace;font-size:12px}.s{font-family:"Malgun Gothic",sans-serif;font-size:11.5px}.b{font-family:"Malgun Gothic",sans-serif;font-size:12px;font-weight:700}</style>
<rect width="560" height="352" fill="#fff"/>
<rect width="560" height="26" fill="#e9e9e9"/>
<text class="s" x="10" y="17" fill="#222">bookrent — 세 번 검색해 본 결과</text>
<rect width="560" height="352" fill="none" stroke="#999"/>
<line x1="0" y1="26" x2="560" y2="26" stroke="#999"/>
<rect x="14" y="48" width="532" height="24" fill="#fff" stroke="#3b6fb5" stroke-width="1.4"/>
<text class="m" x="24" y="65" fill="#111">login</text>
<text class="b" x="14" y="94" fill="#c00">검색 결과가 없습니다</text>
<text class="s" x="150" y="94" fill="#333">→ 로그인 화면도 받는 곳도 없다</text>
<rect x="14" y="140" width="532" height="24" fill="#fff" stroke="#3b6fb5" stroke-width="1.4"/>
<text class="m" x="24" y="157" fill="#111">users</text>
<text class="b" x="14" y="186" fill="#c00">검색 결과가 없습니다</text>
<text class="s" x="150" y="186" fill="#333">→ 회원을 담을 표가 없다</text>
<rect x="14" y="232" width="532" height="24" fill="#fff" stroke="#3b6fb5" stroke-width="1.4"/>
<text class="m" x="24" y="249" fill="#111">rental</text>
<text class="b" x="14" y="278" fill="#c00">검색 결과가 없습니다</text>
<text class="s" x="150" y="278" fill="#333">→ 대여 화면도 표도 없다</text>
<text class="s" x="14" y="340" fill="#c00">→ 세 번 다 0건. 이 «없음» 이 곧 문제점 두 줄이 된다.</text>
</svg>
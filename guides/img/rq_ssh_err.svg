<text class="t" x="10" y="19">명령 프롬프트</text>
<text class="t" x="467" y="19" font-size="11">–</text>
<text class="t" x="487" y="19" font-size="11">□</text>
<text class="t" x="507" y="19" font-size="11">✕</text>
<text class="m" xml:space="preserve" x="12" y="52" fill="#8a8a8a" font-style="italic">[1] 팀 포트로 바꾸지 않고 기본값 그대로 둔 경우</text>
<text class="m" xml:space="preserve" x="12" y="70" fill="#ffffff" font-weight="700">C:\Users\hong&gt;ssh survey@192.168.0.10</text>
<text class="m" xml:space="preserve" x="12" y="87" fill="#cccccc">ssh: connect to host 192.168.0.10 port 22: Connection refused</text>
<text class="m" xml:space="preserve" x="12" y="104" fill="#cccccc"></text>
<text class="m" xml:space="preserve" x="12" y="122" fill="#8a8a8a" font-style="italic">[2] 주소를 잘못 적은 경우 — 한참 기다린 뒤에 나온다</text>
<text class="m" xml:space="preserve" x="12" y="140" fill="#ffffff" font-weight="700">C:\Users\hong&gt;ssh survey@192.168.0.99 -p 2201</text>
<text class="m" xml:space="preserve" x="12" y="157" fill="#cccccc">ssh: connect to host 192.168.0.99 port 2201: Connection timed out</text>
<text class="m" xml:space="preserve" x="12" y="174" fill="#cccccc"></text>
<text class="m" xml:space="preserve" x="12" y="192" fill="#8a8a8a" font-style="italic">[3] 비밀번호를 틀린 경우 — 세 번까지 다시 묻는다</text>
<text class="m" xml:space="preserve" x="12" y="210" fill="#cccccc">survey@192.168.0.10's password:</text>
<text class="m" xml:space="preserve" x="12" y="227" fill="#cccccc">Permission denied, please try again.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 332" width="742" height="332"><style>.s{font-family:"Malgun Gothic",sans-serif;font-size:11.5px}.b{font-family:"Malgun Gothic",sans-serif;font-size:12.5px;font-weight:700}.k{font-family:"Malgun Gothic",sans-serif;font-size:11px;fill:#666}.c{font-family:"Malgun Gothic",sans-serif;font-size:11px;font-weight:700;fill:#fff}</style>
<defs><marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#c00"/></marker></defs>
<rect width="742" height="332" fill="#fff"/>

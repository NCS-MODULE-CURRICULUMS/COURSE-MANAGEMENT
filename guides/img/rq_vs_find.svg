<text class="m" xml:space="preserve" x="58" y="225" fill="#333">            url="jdbc:mysql://db-a:3306/bookrent?..."</text>
<text class="s" x="12" y="267" fill="#c00">→ 찾는 말을 넣으면 어느 파일 몇째 줄인지 바로 나온다. 조사는 대부분 이것으로 끝난다.</text>

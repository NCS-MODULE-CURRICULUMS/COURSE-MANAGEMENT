<text class="m" xml:space="preserve" x="10" y="114" fill="#555">  src</text>
<text class="m" xml:space="preserve" x="10" y="130" fill="#555">  pom.xml</text>
<text class="m" x="194" y="69" fill="#999" text-anchor="end">1</text>
<text class="m" xml:space="preserve" x="202" y="69" fill="#111">-- 도서 관리 시스템 — 표 구성</text>
<text class="m" x="194" y="86" fill="#999" text-anchor="end">2</text>
<text class="m" xml:space="preserve" x="202" y="86" fill="#111">--</text>
<text class="m" x="194" y="102" fill="#999" text-anchor="end">3</text>
<text class="m" xml:space="preserve" x="202" y="102" fill="#111">-- 운영 서버(MySQL)에 만들어 둔 것과 같다.</text>
<text class="m" x="194" y="118" fill="#999" text-anchor="end">4</text>
<text class="m" xml:space="preserve" x="202" y="118" fill="#111">-- 서버가 바뀌면 이 파일로 다시 만든다.</text>
<text class="m" x="194" y="135" fill="#999" text-anchor="end">5</text>
<text class="m" xml:space="preserve" x="202" y="135" fill="#111"></text>
<rect x="168" y="140" width="365" height="16.5" fill="#fff3bf"/>
<text class="m" x="194" y="152" fill="#999" text-anchor="end">6</text>
<text class="m" xml:space="preserve" x="202" y="152" fill="#111">CREATE TABLE IF NOT EXISTS books (</text>
<line x1="527" y1="148" x2="537" y2="148" stroke="#c00"/>
<text class="n" x="541" y="152" fill="#c00">표가 books 하나뿐이다</text>
<text class="m" x="194" y="168" fill="#999" text-anchor="end">7</text>
<text class="m" xml:space="preserve" x="202" y="168" fill="#111">    id         INT AUTO_INCREMENT PRIMARY KEY,</text>
<text class="m" x="194" y="184" fill="#999" text-anchor="end">8</text>
<text class="m" xml:space="preserve" x="202" y="184" fill="#111">    title      VARCHAR(200) NOT NULL,</text>
<text class="m" x="194" y="201" fill="#999" text-anchor="end">9</text>
<text class="m" xml:space="preserve" x="202" y="201" fill="#111">    author     VARCHAR(100),</text>
<text class="m" x="194" y="218" fill="#999" text-anchor="end">10</text>
<text class="m" xml:space="preserve" x="202" y="218" fill="#111">    publisher  VARCHAR(100)</text>
<text class="m" x="194" y="234" fill="#999" text-anchor="end">11</text>
<text class="m" xml:space="preserve" x="202" y="234" fill="#111">) ENGINE=InnoDB DEFAULT CHARSET=utf8;</text>
<text class="m" x="194" y="250" fill="#999" text-anchor="end">12</text>
<text class="m" xml:space="preserve" x="202" y="250" fill="#111"></text>
<line x1="527" y1="246" x2="537" y2="246" stroke="#c00"/>

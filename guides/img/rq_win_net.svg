<text class="m" xml:space="preserve" x="12" y="52" fill="#ffffff" font-weight="700">C:\Users\hong&gt;ipconfig</text>
<text class="m" xml:space="preserve" x="12" y="70" fill="#cccccc"></text>
<text class="m" xml:space="preserve" x="12" y="87" fill="#cccccc">Windows IP 구성</text>
<text class="m" xml:space="preserve" x="12" y="104" fill="#cccccc"></text>
<text class="m" xml:space="preserve" x="12" y="122" fill="#cccccc">무선 LAN 어댑터 Wi-Fi:</text>
<text class="m" xml:space="preserve" x="12" y="140" fill="#cccccc"></text>
<text class="m" xml:space="preserve" x="12" y="157" fill="#cccccc">   연결별 DNS 접미사. . . . :</text>
<text class="m" xml:space="preserve" x="12" y="174" fill="#cccccc">   IPv4 주소 . . . . . . . . : 192.168.0.23</text>
<text class="m" xml:space="preserve" x="12" y="192" fill="#cccccc">   서브넷 마스크 . . . . . . : 255.255.255.0</text>
<text class="m" xml:space="preserve" x="12" y="210" fill="#cccccc">   기본 게이트웨이 . . . . . : 192.168.0.1</text>
<text class="m" xml:space="preserve" x="12" y="227" fill="#cccccc"></text>
<text class="m" xml:space="preserve" x="12" y="244" fill="#8a8a8a" font-style="italic">→ 192.168 로 시작하면 내부망이다.</text>
<text class="m" xml:space="preserve" x="12" y="262" fill="#8a8a8a" font-style="italic">  조사표에는 「내부망(192.168.0.0/24), 방화벽 없음」 처럼 적는다</text>

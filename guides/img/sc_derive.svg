<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330"><style>text{font-family:"Malgun Gothic",sans-serif}rect,line,path{stroke-width:1}</style><defs><marker id="on" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#000"/></marker><marker id="og" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,4 L1,7" fill="none" stroke="#bbb"/></marker></defs><rect width="900" height="330" fill="#fff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#000" text-anchor="start">화면 뽑기 — 유스케이스 명세의 「시스템이 …한다」 줄이 화면이 됩니다</text><line x1="20" y1="38" x2="880" y2="38" stroke="#ccc"/><text x="40" y="66" font-size="11.5" font-weight="700" fill="#000" text-anchor="start">유스케이스</text><text x="560" y="66" font-size="11.5" font-weight="700" fill="#000" text-anchor="start">화면</text><ellipse cx="155" cy="107" rx="118" ry="30" fill="#fff" stroke="#000"/><text x="155" y="102" font-size="10.5" font-weight="700" fill="#000" text-anchor="middle">UC-03</text><text x="155" y="120" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">상품 검색</text><ellipse cx="155" cy="177" rx="118" ry="30" fill="#fff" stroke="#000"/><text x="155" y="172" font-size="10.5" font-weight="700" fill="#000" text-anchor="middle">UC-04</text><text x="155" y="190" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">상품 상세 보기</text><ellipse cx="155" cy="247" rx="118" ry="30" fill="#fff" stroke="#000"/><text x="155" y="242" font-size="10.5" font-weight="700" fill="#000" text-anchor="middle">UC-05</text><text x="155" y="260" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">장바구니 담기</text><rect x="560" y="82" width="230" height="50" rx="0" fill="#fff" stroke="#000"/><text x="675.0" y="102" font-size="10.5" font-weight="700" fill="#000" text-anchor="middle">SC-02</text><text x="675.0" y="120" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">상품 목록</text><rect x="560" y="152" width="230" height="50" rx="0" fill="#fff" stroke="#000"/><text x="675.0" y="172" font-size="10.5" font-weight="700" fill="#000" text-anchor="middle">SC-03</text><text x="675.0" y="190" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">상품 상세</text><rect x="560" y="222" width="230" height="50" rx="0" fill="#fff" stroke="#000"/><text x="675.0" y="242" font-size="10.5" font-weight="700" fill="#000" text-anchor="middle">SC-04</text><text x="675.0" y="260" font-size="12.5" font-weight="400" fill="#000" text-anchor="middle">장바구니</text><line x1="273" y1="107" x2="560" y2="107" stroke="#000" marker-end="url(#on)"/><line x1="273" y1="177" x2="560" y2="177" stroke="#000" marker-end="url(#on)"/><line x1="273" y1="247" x2="560" y2="247" stroke="#000" marker-end="url(#on)"/><path d="M266 236 C 400 232, 430 200, 560 192" fill="none" stroke="#000" marker-end="url(#on)"/><text x="415" y="100" font-size="10.5" font-weight="400" fill="#555" text-anchor="middle">한 줄 → 화면 하나</text><text x="396" y="198" font-size="10.5" font-weight="400" fill="#555" text-anchor="middle">담기 버튼이 놓일 자리</text><text x="20" y="292" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">UC-05 담기는 상세 화면의 버튼이면서 장바구니 화면이기도 합니다. 이렇게 한 유스케이스가 두 화면에 걸치는 경우가 있습니다.</text><text x="20" y="312" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">반대로 유스케이스에 없는데 필요한 화면도 있습니다. 로그인과 주문 완료가 그렇습니다.</text></svg>
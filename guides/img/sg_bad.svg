<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372"><style>text{font-family:"Malgun Gothic","맑은 고딕",sans-serif}</style><rect width="900" height="372" fill="#fff"/><line x1="458" y1="30" x2="458" y2="352" stroke="#ececf0" stroke-width="1"/><rect x="36" y="30" width="40" height="19" rx="10" fill="#f0f1f3"/><text x="56" y="43.5" font-size="10.5" font-weight="700" fill="#8b9099" text-anchor="middle">잘못</text><text x="86" y="44" font-size="12.5" font-weight="700" fill="#16181c" text-anchor="start">값을 글로만 적었습니다</text><rect x="480" y="30" width="40" height="19" rx="10" fill="#2b4c7e"/><text x="500" y="43.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">고침</text><text x="530" y="44" font-size="12.5" font-weight="700" fill="#16181c" text-anchor="start">숫자로 적고 견본을 그렸습니다</text><text x="36" y="80" font-size="12" font-weight="400" fill="#4a4f57" text-anchor="start">색상 : 파란색 계열과 주황색</text><text x="36" y="104" font-size="12" font-weight="400" fill="#4a4f57" text-anchor="start">폰트 : 고딕체, 적당한 크기</text><text x="36" y="128" font-size="12" font-weight="400" fill="#4a4f57" text-anchor="start">레이아웃 : 반응형으로 구성</text><rect x="480" y="69" width="22" height="14" rx="3" fill="#2b4c7e"/><rect x="508" y="69" width="22" height="14" rx="3" fill="#e8590c"/><text x="540" y="80" font-size="12" font-weight="400" fill="#4a4f57" text-anchor="start" letter-spacing=".04em">#2B4C7E · #E8590C</text><text x="480" y="104" font-size="12" font-weight="400" fill="#4a4f57" text-anchor="start">본문 16 / 400 · 행간 1.5</text><text x="480" y="128" font-size="12" font-weight="400" fill="#4a4f57" text-anchor="start">12칼럼 · 거터 24 · 상품 4열 (≥1280)</text><line x1="36" y1="162" x2="864" y2="162" stroke="#ececf0" stroke-width="1"/><rect x="36" y="186" width="40" height="19" rx="10" fill="#f0f1f3"/><text x="56" y="199.5" font-size="10.5" font-weight="700" fill="#8b9099" text-anchor="middle">잘못</text><text x="86" y="200" font-size="12.5" font-weight="700" fill="#16181c" text-anchor="start">강조색을 아무 데나 썼습니다</text><rect x="480" y="186" width="40" height="19" rx="10" fill="#2b4c7e"/><text x="500" y="199.5" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">고침</text><text x="530" y="200" font-size="12.5" font-weight="700" fill="#16181c" text-anchor="start">강조색을 가격에만 썼습니다</text><rect x="36" y="216" width="300" height="118" rx="8" fill="none" stroke="#ececf0" stroke-width="1"/><rect x="52" y="232" width="60" height="60" rx="6" fill="#f2f3f5"/><text x="128" y="250" font-size="12" font-weight="400" fill="#4a4f57" text-anchor="start">신선한 사과 1kg</text><text x="128" y="274" font-size="16" font-weight="700" fill="#e8590c" text-anchor="start">12,900원</text><rect x="128" y="290" width="96" height="28" rx="5" fill="#e8590c"/><text x="176" y="309" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">장바구니</text><rect x="232" y="290" width="88" height="28" rx="5" fill="#fff" stroke="#e8590c" stroke-width="1"/><text x="276" y="309" font-size="11.5" font-weight="600" fill="#e8590c" text-anchor="middle">더 보기</text><rect x="480" y="216" width="300" height="118" rx="8" fill="none" stroke="#ececf0" stroke-width="1"/><rect x="496" y="232" width="60" height="60" rx="6" fill="#f2f3f5"/><text x="572" y="250" font-size="12" font-weight="400" fill="#4a4f57" text-anchor="start">신선한 사과 1kg</text><text x="572" y="274" font-size="16" font-weight="700" fill="#e8590c" text-anchor="start">12,900원</text><rect x="572" y="290" width="96" height="28" rx="5" fill="#2b4c7e"/><text x="620" y="309" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">장바구니</text><rect x="676" y="290" width="88" height="28" rx="5" fill="#fff" stroke="#dfe2e6" stroke-width="1"/><text x="720" y="309" font-size="11.5" font-weight="600" fill="#8b9099" text-anchor="middle">더 보기</text><text x="36" y="356" font-size="11.5" font-weight="400" fill="#8b9099" text-anchor="start">강조색이 세 곳에 흩어져 가격이 묻힙니다</text><text x="480" y="356" font-size="11.5" font-weight="400" fill="#8b9099" text-anchor="start">가격 하나만 강조되어 먼저 눈에 들어옵니다</text></svg>
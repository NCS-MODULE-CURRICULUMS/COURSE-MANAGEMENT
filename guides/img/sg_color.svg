<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" width="900" height="366"><style>text{font-family:"Malgun Gothic","맑은 고딕",sans-serif}</style><defs><clipPath id="cb"><rect x="36" y="324" width="828" height="26" rx="6"/></clipPath></defs><rect width="900" height="366" fill="#fff"/><text x="36" y="40" font-size="12.5" font-weight="400" fill="#4a4f57" text-anchor="start">역할을 먼저 정하고, 그 역할에 색을 하나씩 배정합니다</text><rect x="36" y="66" width="108" height="56" rx="10" fill="#F9FAFB" stroke="#ececf0" stroke-width="1"/><text x="168" y="90" font-size="13.5" font-weight="700" fill="#16181c" text-anchor="start">주조 60%</text><text x="168" y="109" font-size="11.5" font-weight="500" fill="#8b9099" text-anchor="start" letter-spacing=".06em">#F9FAFB</text><text x="300" y="100" font-size="12.5" font-weight="400" fill="#4a4f57" text-anchor="start">바탕과 카드 배경. 화면에서 가장 넓은 면적</text><rect x="36" y="136" width="108" height="56" rx="10" fill="#2B4C7E"/><text x="168" y="160" font-size="13.5" font-weight="700" fill="#16181c" text-anchor="start">보조 30%</text><text x="168" y="179" font-size="11.5" font-weight="500" fill="#8b9099" text-anchor="start" letter-spacing=".06em">#2B4C7E</text><text x="300" y="170" font-size="12.5" font-weight="400" fill="#4a4f57" text-anchor="start">헤더 · GNB · 기본 버튼. 브랜드가 드러나는 자리</text><rect x="36" y="206" width="108" height="56" rx="10" fill="#E8590C"/><text x="168" y="230" font-size="13.5" font-weight="700" fill="#16181c" text-anchor="start">강조 10%</text><text x="168" y="249" font-size="11.5" font-weight="500" fill="#8b9099" text-anchor="start" letter-spacing=".06em">#E8590C</text><text x="300" y="240" font-size="12.5" font-weight="400" fill="#4a4f57" text-anchor="start">가격과 구매 버튼에만. 다른 곳에는 쓰지 않습니다</text><line x1="36" y1="288" x2="864" y2="288" stroke="#ececf0" stroke-width="1"/><text x="36" y="312" font-size="11.5" font-weight="400" fill="#8b9099" text-anchor="start">한 화면에서 차지하는 면적을 이 비율에 맞춥니다</text><g clip-path="url(#cb)"><rect x="36" y="324" width="496.79999999999995" height="26" rx="0" fill="#F9FAFB"/><text x="284.4" y="341" font-size="11" font-weight="600" fill="#8b9099" text-anchor="middle">주조 60</text><rect x="532.8" y="324" width="248.39999999999998" height="26" rx="0" fill="#2b4c7e"/><text x="657.0" y="341" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">보조 30</text><rect x="781.1999999999999" y="324" width="82.80000000000001" height="26" rx="0" fill="#e8590c"/><text x="822.5999999999999" y="341" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">강조 10</text></g><rect x="36" y="324" width="828" height="26" rx="6" fill="none" stroke="#ececf0" stroke-width="1"/></svg>
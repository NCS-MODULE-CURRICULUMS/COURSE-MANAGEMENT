<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
<style>text{font-family:"Malgun Gothic",sans-serif;fill:#000}</style>
<defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3.5 L0,7 z" fill="#000"/></marker></defs>
<rect width="900" height="540" fill="#fff"/>
<text x="20" y="26" font-size="13.5" font-weight="700">흐름은 어디서 갈라지는가 — 「장바구니 담기」 명세서</text>
<line x1="20" y1="36" x2="880" y2="36" stroke="#ccc"/>
<text x="320" y="54" font-size="12" font-weight="700" text-anchor="start" fill="#000">정상 흐름</text>
<rect x="320" y="62" width="250" height="36" rx="3" fill="#fff" stroke="#000"/>
<text x="330" y="78" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">1. 회원이 옵션과 수량을 고릅니다</text>
<text x="330" y="92" font-size="10" font-weight="400" text-anchor="start" fill="#555">사람</text>
<rect x="320" y="130" width="250" height="36" rx="3" fill="#fff" stroke="#000"/>
<text x="330" y="146" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">2. 회원이 「담기」를 누릅니다</text>
<text x="330" y="160" font-size="10" font-weight="400" text-anchor="start" fill="#555">사람</text>
<rect x="320" y="198" width="250" height="36" rx="3" fill="#fff" stroke="#000"/>
<text x="330" y="214" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">3. 시스템이 로그인·재고를 확인합니다</text>
<text x="330" y="228" font-size="10" font-weight="400" text-anchor="start" fill="#555">시스템</text>
<rect x="320" y="266" width="250" height="36" rx="3" fill="#fff" stroke="#000"/>
<text x="330" y="282" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">4. 시스템이 담고 알림을 띄웁니다</text>
<text x="330" y="296" font-size="10" font-weight="400" text-anchor="start" fill="#555">시스템</text>
<rect x="320" y="334" width="250" height="36" rx="3" fill="#fff" stroke="#000"/>
<text x="330" y="350" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">5. 회원이 계속 쇼핑하거나 이동합니다</text>
<text x="330" y="364" font-size="10" font-weight="400" text-anchor="start" fill="#555">사람</text>
<line x1="445" y1="98" x2="445" y2="128" stroke="#000" marker-end="url(#ar)"/>
<line x1="445" y1="166" x2="445" y2="196" stroke="#000" marker-end="url(#ar)"/>
<line x1="445" y1="234" x2="445" y2="264" stroke="#000" marker-end="url(#ar)"/>
<line x1="445" y1="302" x2="445" y2="332" stroke="#000" marker-end="url(#ar)"/>
<text x="30" y="54" font-size="12" font-weight="700" text-anchor="start" fill="#000">예외 흐름 — 막고 끝난다</text>
<rect x="30" y="180" width="250" height="36" rx="3" fill="#fff" stroke="#000"/>
<text x="40" y="196" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">3a. 비로그인이면</text>
<text x="40" y="210" font-size="10" font-weight="400" text-anchor="start" fill="#555">로그인 화면으로 보냅니다</text>
<line x1="320" y1="216" x2="284" y2="198" stroke="#000" marker-end="url(#ar)"/>
<rect x="30" y="240" width="250" height="36" rx="3" fill="#fff" stroke="#000"/>
<text x="40" y="256" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">3b. 옵션을 안 골랐으면</text>
<text x="40" y="270" font-size="10" font-weight="400" text-anchor="start" fill="#555">오류를 표시하고 담지 않습니다</text>
<line x1="320" y1="216" x2="284" y2="258" stroke="#000" marker-end="url(#ar)"/>
<rect x="30" y="300" width="250" height="36" rx="3" fill="#fff" stroke="#000"/>
<text x="40" y="316" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">3c. 재고보다 많으면</text>
<text x="40" y="330" font-size="10" font-weight="400" text-anchor="start" fill="#555">「재고 24개」를 알리고 담지 않습니다</text>
<line x1="320" y1="216" x2="284" y2="318" stroke="#000" marker-end="url(#ar)"/>
<text x="30" y="372" font-size="11.5" font-weight="400" text-anchor="start" fill="#555">셋 다 3단계에서 갈라집니다.</text>
<text x="30" y="390" font-size="11.5" font-weight="400" text-anchor="start" fill="#555">여기서 흐름이 끝나고 되돌아가지 않습니다.</text>
<text x="600" y="54" font-size="12" font-weight="700" text-anchor="start" fill="#000">대안 흐름 — 돌아온다</text>
<rect x="600" y="130" width="270" height="36" rx="3" fill="#fff" stroke="#000"/>
<text x="610" y="146" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">2a. 이미 담긴 상품이면</text>
<text x="610" y="160" font-size="10" font-weight="400" text-anchor="start" fill="#555">새로 넣지 않고 수량만 더합니다</text>
<line x1="570" y1="148" x2="600" y2="148" stroke="#000" marker-end="url(#ar)"/>
<line x1="735" y1="166" x2="735" y2="284" stroke="#000"/>
<line x1="735" y1="284" x2="580" y2="284" stroke="#000"/>
<line x1="580" y1="284" x2="572" y2="284" stroke="#000" marker-end="url(#ar)"/>
<text x="600" y="200" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">4단계로 합류합니다.</text>
<text x="600" y="218" font-size="11.5" font-weight="400" text-anchor="start" fill="#555">결과는 같고 경로만 다릅니다.</text>
<rect x="600" y="334" width="270" height="36" rx="3" fill="#fff" stroke="#000"/>
<text x="610" y="350" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">5a. 「장바구니 보기」를 누르면</text>
<text x="610" y="364" font-size="10" font-weight="400" text-anchor="start" fill="#555">SC-04 장바구니로 이동합니다</text>
<line x1="570" y1="352" x2="600" y2="352" stroke="#000" marker-end="url(#ar)"/>
<line x1="20" y1="422" x2="880" y2="422" stroke="#ccc"/>
<text x="30" y="446" font-size="12" font-weight="700" text-anchor="start" fill="#000">번호 규칙</text>
<text x="30" y="468" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">갈라져 나온 단계의 번호 뒤에 a · b · c 를 붙입니다. 3a 는 「3단계에서 갈라지는 첫 번째 경우」입니다.</text>
<text x="30" y="488" font-size="11.5" font-weight="400" text-anchor="start" fill="#000">번호만 봐도 어디서 갈라지는지 보여야 합니다. 그래야 화면을 설계할 때 그 지점을 찾을 수 있습니다.</text>
<text x="30" y="516" font-size="11.5" font-weight="400" text-anchor="start" fill="#555">가르는 기준 — 「원래 하려던 일을 결국 해내는가?」  해내면 대안, 못 하고 막히면 예외입니다.</text>
</svg>

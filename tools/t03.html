<script>
(function(){
  var KEY = 'cm_check_v1', st = {};
  try{ st = JSON.parse(localStorage.getItem(KEY) || '{}'); }catch(e){ st = {}; }

  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

  function draw(){
    var h = '', n = 0, done = 0;
    CM_CHECK.forEach(function(g, gi){
      h += '<div class="grp"><h2>' + g.g +
           (g.gate ? '<span class="gate">' + g.gate + '</span>' : '') + '</h2>';
      g.items.forEach(function(it, ii){
        var k = gi + '_' + ii, on = !!st[k];
        n++; if(on) done++;
        h += '<label class="it' + (on ? ' ok' : '') + '" data-k="' + k + '">' +
             '<input type="checkbox"' + (on ? ' checked' : '') + '>' +
             '<span class="tx">' + it[0] +
             (it[1] ? '<small>' + it[1] + '</small>' : '') + '</span></label>';
      });
      h += '</div>';
    });
    document.getElementById('list').innerHTML = h;
    document.getElementById('pNum').textContent = done + ' / ' + n;
    document.getElementById('pBar').style.width = n ? (done / n * 100) + '%' : '0';
    Array.prototype.forEach.call(document.querySelectorAll('.it'), function(el){
      el.querySelector('input').onchange = function(){
        st[el.getAttribute('data-k')] = this.checked;
        save(); draw();
      };
    });
  }
  document.getElementById('bReset').onclick = function(){
    if(!confirm('체크를 모두 해제합니다. 계속할까요?')) return;
    st = {}; save(); draw();
  };
  document.getElementById('bPrint').onclick = function(){ window.print(); };
  draw();
})();
</script>
